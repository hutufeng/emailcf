name = "emailcf"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 绑定 Cloudflare Workers AI（免费开源模型）
[ai]
binding = "AI"

# 邮件路由与触发
# 部署后在 Cloudflare 控制台 Email Routing -> Routing Rules 中将目标规则绑定到此 Worker

# 默认基础配置（私密凭证 TG_BOT_TOKEN 和 TG_CHAT_ID 请通过 secret 或 CI/CD 配置）
[vars]
DEFAULT_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
